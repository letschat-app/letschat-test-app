<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="preload" as="image" href="splash-poster.png" fetchpriority="high" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <title>LetsChat</title>
</head>

<body>
  <div id="pwa-splash-loader" aria-label="LetsChat loading">
    <style>
      #pwa-splash-loader {
        position: fixed;
        inset: 0;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #010316;
        z-index: 999999;
        line-height: 0;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      #pwa-splash-loader.fade-out {
        opacity: 0 !important;
        visibility: hidden !important;
      }

      #pwa-splash-loader .splash-poster {
        position: relative;
        width: min(100vw, calc(100dvh * 2 / 3), 1024px);
        aspect-ratio: 1024 / 1536;
        overflow: hidden;
        flex: 0 0 auto;
      }

      #pwa-splash-loader .splash-base {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
      }

      /* The three loading dots from the updated design. */
      #pwa-splash-loader .animated-dots {
        position: absolute;
        left: calc(441 / 1024 * 100%);
        top: calc(760 / 1536 * 100%);
        width: calc(142 / 1024 * 100%);
        height: calc(30 / 1536 * 100%);
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 3;
      }

      #pwa-splash-loader .dot {
        width: calc(22 / 142 * 100%);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #5f568a;
        box-shadow: 0 0 0 rgba(146, 92, 255, 0);
        animation: letschat-pulse 500ms infinite;
      }

      #pwa-splash-loader .dot:nth-child(1) {
        animation-delay: 0ms;
      }

      #pwa-splash-loader .dot:nth-child(2) {
        animation-delay: 166.667ms;
      }

      #pwa-splash-loader .dot:nth-child(3) {
        animation-delay: 333.333ms;
      }

      @keyframes letschat-pulse {

        0%,
        33.333%,
        100% {
          background: #5f568a;
          box-shadow: 0 0 0 rgba(146, 92, 255, 0);
          transform: scale(1);
        }

        16.666% {
          background: #9b62ff;
          box-shadow:
            0 0 7px rgba(155, 98, 255, .9),
            0 0 16px rgba(90, 105, 255, .55);
          transform: scale(1.08);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #pwa-splash-loader .dot {
          animation: none;
        }

        #pwa-splash-loader .dot:first-child {
          background: #9b62ff;
          box-shadow: 0 0 10px rgba(155, 98, 255, .75);
        }
      }
    </style>

    <main class="splash-poster" aria-label="LetsChat">
      <img class="splash-base"
        src="splash-poster.png"
        alt="LetsChat — Chat without the chaos." />

      <div class="animated-dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </main>
  </div>

  <div id="root"></div>
  <script type="module" src="src/main.jsx"></script>
</body>

</html>
